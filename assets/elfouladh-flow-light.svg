<svg xmlns="http://www.w3.org/2000/svg" width="560" height="648" viewBox="0 0 560 648" role="img" aria-label="El Fouladh attendance workflow: a worker files a leave or mission request, or justifies past absences; the dossier is saved with status En attente; the HR manager reviews the document and approves or rejects with a reason; every calendar day is recomputed live from presences, validated requests and justifications; the worker sees the outcome and any refusal reason in Mes demandes and can export a PDF.">
  <title>El Fouladh — request and validation workflow</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F7FC"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B93F8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="647" rx="16" fill="url(#fbg)" stroke="#DCE5F0"/>
  <text x="48" y="32" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2.5" fill="#5B6B84">EL FOULADH · ATTENDANCE WORKFLOW</text>

  <!-- arrows -->
  <g stroke="#8B93F8" stroke-width="1.6" fill="none">
    <line x1="280" y1="138" x2="280" y2="167" marker-end="url(#arrow)"/>
    <line x1="280" y1="260" x2="280" y2="289" marker-end="url(#arrow)"/>
    <line x1="280" y1="382" x2="280" y2="411" marker-end="url(#arrow)"/>
    <line x1="280" y1="504" x2="280" y2="533" marker-end="url(#arrow)"/>
  </g>

  <!-- packet travelling down the flow (drawn under the cards) -->
  <circle r="3.2" fill="#0891B2">
    <animateMotion dur="7s" repeatCount="indefinite" path="M280,58 L280,616"/>
  </circle>

  <!-- 01 · worker -->
  <g>
    <rect x="48" y="52" width="464" height="82" rx="12" fill="#FAFCFF" stroke="#DCE5F0"/>
    <circle cx="80" cy="93" r="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="80" y="97" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6366F1">01</text>
    <text x="108" y="81" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Worker</text>
    <text x="108" y="103" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">Files a leave or mission request, or justifies</text>
    <text x="108" y="120" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">past absences — signed document attached.</text>
  </g>

  <!-- 02 · request saved -->
  <g>
    <rect x="48" y="174" width="464" height="82" rx="12" fill="#FAFCFF" stroke="#DCE5F0"/>
    <circle cx="80" cy="215" r="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="80" y="219" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6366F1">02</text>
    <text x="108" y="203" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Request saved</text>
    <text x="108" y="225" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">Stored with status « En attente » —</text>
    <text x="108" y="242" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">an explicit HR decision is required.</text>
  </g>

  <!-- 03 · HR review -->
  <g>
    <rect x="48" y="296" width="464" height="82" rx="12" fill="#FAFCFF" stroke="#DCE5F0"/>
    <circle cx="80" cy="337" r="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="80" y="341" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6366F1">03</text>
    <text x="108" y="325" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">HR review</text>
    <text x="108" y="347" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">The HR manager previews the document,</text>
    <text x="108" y="364" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">then approves or rejects with a reason.</text>
  </g>

  <!-- 04 · live calendar -->
  <g>
    <rect x="48" y="418" width="464" height="82" rx="12" fill="#FAFCFF" stroke="#DCE5F0"/>
    <circle cx="80" cy="459" r="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="80" y="463" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6366F1">04</text>
    <text x="108" y="447" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Live calendar</text>
    <text x="108" y="469" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">Every day is recomputed on the fly from presences,</text>
    <text x="108" y="486" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">validated requests and justifications — nothing stored.</text>
  </g>

  <!-- 05 · mes demandes -->
  <g>
    <rect x="48" y="540" width="464" height="82" rx="12" fill="#FAFCFF" stroke="#DCE5F0"/>
    <circle cx="80" cy="581" r="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="80" y="585" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6366F1">05</text>
    <text x="108" y="569" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#0891B2">« Mes demandes »</text>
    <text x="108" y="591" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">The worker sees the outcome and any refusal reason;</text>
    <text x="108" y="608" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5B6B84">every dossier exports to PDF.</text>
  </g>
</svg>
