<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-label="GitHub streak: current streak, longest streak, total contributions">
  <title>GitHub streak: current streak, longest streak, total contributions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1A2E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E51C9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="119" rx="16" fill="url(#bg)" stroke="#23304F"/>
  <g stroke="#23304F" stroke-opacity="0.9"><line x1="293.3333333333333" y1="30" x2="293.3333333333333" y2="90"/><line x1="586.6666666666666" y1="30" x2="586.6666666666666" y2="90"/></g><text x="146.66666666666666" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#8CA3C7">CURRENT STREAK</text><text x="146.66666666666666" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#E6EDF7">2 days</text><text x="440" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#8CA3C7">LONGEST STREAK</text><text x="440" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#E6EDF7">6 days</text><text x="733.3333333333333" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#8CA3C7">TOTAL CONTRIBUTIONS</text><text x="733.3333333333333" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#E6EDF7">68</text>
