<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Maki Jbelia — Full-Stack Developer">
  <title>Maki Jbelia — Full-Stack Developer</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101C36"/>
    </linearGradient>
    <linearGradient id="hname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.55" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="hglowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hglowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#273755"/>
    </pattern>
    <clipPath id="hclip"><rect x="1" y="1" width="878" height="238" rx="22"/></clipPath>
    <clipPath id="htype1"><rect x="348" y="148" width="0" height="26">
      <animate attributeName="width" values="0;185;185" keyTimes="0;0.10;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="htype2"><rect x="272" y="148" width="0" height="26">
      <animate attributeName="width" values="0;336;336" keyTimes="0;0.10;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="htype3"><rect x="318" y="148" width="0" height="26">
      <animate attributeName="width" values="0;244;244" keyTimes="0;0.10;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="239" rx="23" fill="url(#hbg)" stroke="#23304F"/>

  <g clip-path="url(#hclip)">
    <rect x="0" y="0" width="880" height="240" fill="url(#hdots)" opacity="0.55"/>
    <circle cx="150" cy="60" r="170" fill="url(#hglowA)"/>
    <circle cx="760" cy="190" r="180" fill="url(#hglowB)"/>

    <g stroke="#818CF8" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M34 64 V46 a10 10 0 0 1 10 -10 h18"/>
      <path d="M846 64 V46 a10 10 0 0 0 -10 -10 h-18"/>
      <path d="M34 172 v18 a10 10 0 0 0 10 10 h18"/>
      <path d="M846 172 v18 a10 10 0 0 1 -10 10 h-18"/>
    </g>

    <g fill="#22D3EE">
      <circle cx="120" cy="118" r="2">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="766" cy="96" r="1.6">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="186" r="1.3">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="440" y="66" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="4.5" fill="#8CA3C7">HELLO — I'M</text>
    <text x="440" y="122" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="url(#hname)">MAKI JBELIA</text>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.301;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <g clip-path="url(#htype1)">
        <text x="348" y="168" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#C7D2FE">$ Full-Stack Developer</text>
      </g>
      <rect x="348" y="154" width="1.6" height="18" fill="#22D3EE">
        <animate attributeName="x" values="348;533;533" keyTimes="0;0.10;1" dur="12s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.301;1" dur="12s" begin="4s" repeatCount="indefinite"/>
      <g clip-path="url(#htype2)">
        <text x="272" y="168" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#C7D2FE">$ Django · Spring Boot · Laravel · React</text>
      </g>
      <rect x="272" y="154" width="1.6" height="18" fill="#22D3EE">
        <animate attributeName="x" values="272;608;608" keyTimes="0;0.10;1" dur="12s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.301;1" dur="12s" begin="8s" repeatCount="indefinite"/>
      <g clip-path="url(#htype3)">
        <text x="318" y="168" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#C7D2FE">$ Docker · Kubernetes · CI/CD</text>
      </g>
      <rect x="318" y="154" width="1.6" height="18" fill="#22D3EE">
        <animate attributeName="x" values="318;562;562" keyTimes="0;0.10;1" dur="12s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g fill="#6366F1" fill-opacity="0.10">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-880 0" dur="18s" repeatCount="indefinite"/>
        <path d="M0 216 q55 -14 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V240 H0 Z"/>
        <path d="M880 216 q55 -14 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V240 H880 Z"/>
      </g>
    </g>
    <g fill="#22D3EE" fill-opacity="0.08">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-880 0" dur="26s" repeatCount="indefinite"/>
        <path d="M0 226 q55 -12 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V240 H0 Z"/>
        <path d="M880 226 q55 -12 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V240 H880 Z"/>
      </g>
    </g>
  </g>
</svg>
