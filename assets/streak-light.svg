<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-label="GitHub streak: current streak, longest streak, total contributions">
  <title>GitHub streak: current streak, longest streak, total contributions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F7FC"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="119" rx="16" fill="url(#bg)" stroke="#DCE5F0"/>
  <g stroke="#DCE5F0" stroke-opacity="0.9"><line x1="293.3333333333333" y1="30" x2="293.3333333333333" y2="90"/><line x1="586.6666666666666" y1="30" x2="586.6666666666666" y2="90"/></g><text x="146.66666666666666" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#5B6B84">CURRENT STREAK</text><text x="146.66666666666666" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A">2 days</text><text x="440" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#5B6B84">LONGEST STREAK</text><text x="440" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A">6 days</text><text x="733.3333333333333" y="50" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2" fill="#5B6B84">TOTAL CONTRIBUTIONS</text><text x="733.3333333333333" y="80" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A">67</text>
</svg>
