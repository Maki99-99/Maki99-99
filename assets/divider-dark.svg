<svg xmlns="http://www.w3.org/2000/svg" width="880" height="24" viewBox="0 0 880 24" role="img" aria-label="Thin animated gradient divider">
  <title>Section divider</title>
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23304F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#23304F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dclip"><rect x="40" y="10.6" width="800" height="2.8"/></clipPath>
  </defs>
  <rect x="40" y="11.4" width="800" height="1.2" rx="0.6" fill="url(#dline)"/>
  <g clip-path="url(#dclip)">
    <rect x="-240" y="10.6" width="240" height="2.8" fill="url(#dshine)">
      <animate attributeName="x" values="-240;880" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
