name: Update profile assets

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/update-assets.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile cards (metrics, GitHub stats, top languages)
        env:
          GH_USER: ${{ github.repository_owner }}
          # PAT_1: repository secret, classic PAT with the read:user scope
          # (see CHANGELOG.md). Falls back to the workflow token when unset.
          # Never hardcode tokens here or in scripts.
          GH_STATS_TOKEN: ${{ secrets.PAT_1 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-assets.mjs

      - name: Generate contribution snake (SVG)
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Commit changes (if any)
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh auto-generated assets"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
